<!doctype html>
<html><head><meta charset="utf-8"><title>mdi-animated-card gallery renderer</title>
<style>
:root{--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(255,255,255,.12);--card-background-color:#1c1c1c;--error-color:#f44336;--warning-color:#ffa600}
body{margin:0;background:#111;font-family:Roboto,sans-serif;color:#e1e1e1}
ha-card{display:block;background:var(--card-background-color);border-radius:12px}
mdi-animated-card{display:block;height:92px}
#one{width:300px;padding:0}
#sheet{display:grid;grid-template-columns:repeat(3,300px);gap:14px 12px;padding:12px;width:max-content}
.cell{display:flex;flex-direction:column;gap:4px}
.cap{font-size:12px;color:#9b9b9b;text-align:center;letter-spacing:.3px}
</style></head><body><div id="root"></div>
<script type="module">
import '../dist/mdi-animated-appliances.js';
const q = new URLSearchParams(location.search);
const now = Date.now();
const NAMES = { dishwasher: 'Dishwasher', washer: 'Washing machine', dryer: 'Tumble dryer', vacuum: 'Robot vacuum', mower: 'Robot mower' };
// raw entity state per (appliance, logical state)
const RAW = {
  dishwasher: { washing: 'run', drying: 'run', finished: 'finished', paused: 'pause', delayed: 'delayedstart', error: 'actionrequired', idle: 'inactive', unavailable: 'unavailable' },
  washer: { washing: 'wash', spinning: 'spin', drying: 'drying', finished: 'finish', paused: 'pause', delayed: 'delay_wash', error: 'error', idle: 'none', unavailable: 'unavailable' },
  dryer: { washing: 'on', finished: 'finished', paused: 'pause', delayed: 'delayedstart', error: 'error', idle: 'off', unavailable: 'unavailable' },
  vacuum: { washing: 'cleaning', returning: 'returning', idle: 'docked', paused: 'paused', error: 'error', unavailable: 'unavailable' },
  mower: { washing: 'mowing', returning: 'returning', idle: 'docked', paused: 'paused', error: 'error', unavailable: 'unavailable' },
};
const ROBOT = (a) => a === 'vacuum' || a === 'mower';
function make(a, variant, logical) {
  const raw = RAW[a][logical];
  const cfg = { type: 'custom:mdi-animated-card', appliance: a, entity: a === 'dryer' ? 'binary_sensor.x' : 'sensor.x', name: NAMES[a], language: 'en', icon_size: 64 };
  if (variant) cfg.variant = variant;
  if (a === 'dishwasher' && logical === 'drying') cfg.drying_from_progress = 50;
  if (!ROBOT(a)) { cfg.progress_entity = 'sensor.prog'; cfg.finish_entity = 'sensor.fin'; }
  if (a === 'dryer') { cfg.progress_entity = undefined; cfg.finish_entity = undefined; }
  const states = {
    [a === 'dryer' ? 'binary_sensor.x' : 'sensor.x']: { state: raw, attributes: { battery_level: 78 }, last_changed: new Date(now - 95 * 60000).toISOString() },
    'sensor.prog': { state: '62', attributes: {} },
    'sensor.fin': { state: new Date(now + 40 * 60000).toISOString(), attributes: {} },
  };
  const el = document.createElement('mdi-animated-card');
  el.setConfig(cfg);
  el.hass = { states, locale: { language: 'en' }, language: 'en' };
  return el;
}
const root = document.getElementById('root');
if (q.get('mode') === 'one') {
  const wrap = document.createElement('div'); wrap.id = 'one';
  const el = make(q.get('a'), q.get('v') || null, q.get('s'));
  wrap.appendChild(el); root.appendChild(wrap);
  window.__card = el;
} else if (q.get('mode') === 'sheet') {
  const a = q.get('a'); const sheet = document.createElement('div'); sheet.id = 'sheet';
  for (const s of q.get('s').split(',')) {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.appendChild(make(a, null, s));
    const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = s === 'washing' ? 'running' : (ROBOT(a) && s === 'idle' ? 'docked' : s); cell.appendChild(cap);
    sheet.appendChild(cell);
  }
  root.appendChild(sheet);
  window.__card = sheet;
}
window.__ready = true;
</script></body></html>
