<!doctype html>
<html><head><meta charset="utf-8"><title>mdi-animated-card harness</title>
<style>
:root{--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(255,255,255,.12);--card-background-color:#1c1c1c;--error-color:#f44336;--warning-color:#ffa600}
body{margin:0;background:#111;font-family:Roboto,sans-serif;color:#e1e1e1}
ha-card{display:block;background:var(--card-background-color);border-radius:12px}
#grid{display:grid;grid-template-columns:repeat(3,340px);gap:12px;padding:16px}
</style></head><body><div id="grid"></div>
<script type="module">
import '../dist/mdi-animated-appliances.js';
const now = Date.now();
const states = {
  'sensor.dw': { state: 'run', attributes: { friendly_name: new URLSearchParams(location.search).get('lang') === 'en' ? 'Dishwasher' : 'Zmywarka do naczyń' } },
  'sensor.prog': { state: '62', attributes: {} },
  'sensor.fin': { state: new Date(now + 40*60000).toISOString(), attributes: {} },
};
const lang = new URLSearchParams(location.search).get('lang') || 'pl';
const hass = { states, locale: { language: lang }, language: lang };
window.__hass = hass;
const cases = [
  ['wave / washing', { variant: 'wave' }, 'run'],
  ['bubbles / washing', { variant: 'bubbles' }, 'run'],
  ['drops / washing', { variant: 'drops' }, 'run'],
  ['sway / washing', { variant: 'sway' }, 'run'],
  ['drying (progress>=85)', { variant: 'wave', drying_from_progress: 50 }, 'run'],
  ['finished', {}, 'finished'],
  ['idle', {}, 'inactive'],
  ['paused', {}, 'pause'],
  ['delayed', {}, 'delayedstart'],
  ['error', {}, 'actionrequired'],
  ['unavailable', {}, 'unavailable'],
  ['vertical', { layout: 'vertical' }, 'run'],
  ['washer / tumble', { appliance: 'washer', name: 'Pralka' }, 'wash'],
  ['washer / bubbles', { appliance: 'washer', variant: 'bubbles', name: 'Pralka' }, 'rinse'],
  ['washer / spinning', { appliance: 'washer', name: 'Pralka' }, 'spin'],
  ['washer / drying', { appliance: 'washer', name: 'Pralka' }, 'drying'],
  ['washer / finished', { appliance: 'washer', name: 'Pralka' }, 'finish'],
  ['washer / idle', { appliance: 'washer', name: 'Pralka' }, 'none'],
  ['washer / paused', { appliance: 'washer', name: 'Pralka' }, 'pause'],
  ['washer / error', { appliance: 'washer', name: 'Pralka' }, 'error'],
  ['washer / delayed', { appliance: 'washer', name: 'Pralka' }, 'delay_wash'],
  ['dryer / heat', { appliance: 'dryer', entity: 'binary_sensor.dr', name: 'Suszarka', progress_entity: undefined, finish_entity: undefined }, 'on'],
  ['dryer / tumble', { appliance: 'dryer', variant: 'tumble', entity: 'binary_sensor.dr', name: 'Suszarka', progress_entity: undefined, finish_entity: undefined }, 'on'],
  ['dryer / sway', { appliance: 'dryer', variant: 'sway', entity: 'binary_sensor.dr', name: 'Suszarka', progress_entity: undefined, finish_entity: undefined }, 'on'],
  ['dryer / off', { appliance: 'dryer', entity: 'binary_sensor.dr', name: 'Suszarka', progress_entity: undefined, finish_entity: undefined }, 'off'],
  ['dryer / finished', { appliance: 'dryer', entity: 'sensor.dw', name: 'Suszarka', progress_entity: undefined, finish_entity: undefined }, 'finished'],
  ['vacuum / cleaning', { appliance: 'vacuum', entity: 'binary_sensor.dr', name: 'Roborock', progress_entity: undefined, finish_entity: undefined }, 'cleaning'],
  ['vacuum / returning', { appliance: 'vacuum', entity: 'binary_sensor.dr', name: 'Roborock', progress_entity: undefined, finish_entity: undefined }, 'returning'],
  ['vacuum / docked', { appliance: 'vacuum', entity: 'binary_sensor.dr', name: 'Roborock', progress_entity: undefined, finish_entity: undefined }, 'docked'],
  ['vacuum / paused', { appliance: 'vacuum', entity: 'binary_sensor.dr', name: 'Roborock', progress_entity: undefined, finish_entity: undefined }, 'paused'],
  ['vacuum / error', { appliance: 'vacuum', entity: 'binary_sensor.dr', name: 'Roborock', progress_entity: undefined, finish_entity: undefined }, 'error'],
  ['mower / mowing', { appliance: 'mower', entity: 'binary_sensor.dr', name: 'Luba', progress_entity: undefined, finish_entity: undefined }, 'mowing'],
  ['mower / returning', { appliance: 'mower', entity: 'binary_sensor.dr', name: 'Luba', progress_entity: undefined, finish_entity: undefined }, 'returning'],
  ['mower / docked', { appliance: 'mower', entity: 'binary_sensor.dr', name: 'Luba', progress_entity: undefined, finish_entity: undefined }, 'docked'],
  ['mower / paused', { appliance: 'mower', entity: 'binary_sensor.dr', name: 'Luba', progress_entity: undefined, finish_entity: undefined }, 'paused'],
  ['mower / error', { appliance: 'mower', entity: 'binary_sensor.dr', name: 'Luba', progress_entity: undefined, finish_entity: undefined }, 'error'],
  ['dryer / error', { appliance: 'dryer', entity: 'sensor.dw', name: 'Suszarka', progress_entity: undefined, finish_entity: undefined }, 'error'],
];
const grid = document.getElementById('grid');
window.__cards = [];
// ?preview=1 renders the README showcase: one running card per appliance (+ a robot returning)
const PREVIEW = ['wave / washing', 'washer / tumble', 'dryer / heat', 'vacuum / cleaning', 'mower / mowing', 'vacuum / returning'];
const EN = { 'Pralka': 'Washing machine', 'Suszarka': 'Tumble dryer', 'Luba': 'Robot mower', 'Roborock': 'Robot vacuum' };
const shown = new URLSearchParams(location.search).get('preview') ? PREVIEW.map((l) => cases.find((c) => c[0] === l)) : cases;
for (const [label, extra0, st] of shown) {
  const extra = new URLSearchParams(location.search).get('preview') && EN[extra0.name] ? { ...extra0, name: EN[extra0.name] } : extra0;
  const h = { ...hass, states: { ...states, 'sensor.dw': { ...states['sensor.dw'], state: st }, 'binary_sensor.dr': { state: st, attributes: { battery_level: 78 }, last_changed: new Date(now - 95*60000).toISOString() } } };
  const el = document.createElement('mdi-animated-card');
  el.setConfig({ type: 'custom:mdi-animated-card', entity: 'sensor.dw', progress_entity: 'sensor.prog', finish_entity: 'sensor.fin', ...extra });
  el.hass = h;
  el.dataset.label = label;
  grid.appendChild(el);
  window.__cards.push(el);
}
window.__ready = true;
</script></body></html>
